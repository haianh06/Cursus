services:
  - type: web
    name: cursus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "8000"
      # Render routes traffic to PORT (10000 by default). Keep this explicit
      # so the container's listener and Render proxy cannot drift apart.
      - key: PORT
        value: "10000"
      - key: APP_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_ON_START
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CSRF_PROTECTION_ENABLED
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: ACCESS_TOKEN_COOKIE_SAMESITE
        value: none
      - key: ACCESS_TOKEN_COOKIE_SECURE
        value: "true"
      - key: REFRESH_TOKEN_COOKIE_SAMESITE
        value: none
      - key: REFRESH_TOKEN_COOKIE_SECURE
        value: "true"
      - key: MODEL_NAME
        value: gemini-2.5-flash
      # Cursus Chat's generation (src.services.core.ai_engine) — folded in
      # from the formerly-standalone ai-service (27/08), now runs in-process
      # on this same service. No second Render service needed anymore.
      - key: OPENAI_STRONG_MODEL
        value: pro/gpt-5.6-terra
      - key: OPENAI_LIGHT_MODEL
        value: pro/gpt-5.6-luna
      - key: CURSUS_CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: LLM_DAILY_REQUEST_LIMIT
        value: "2000"
      - key: CHAT_ACTION_PROPOSAL_RETENTION_DAYS
        value: "30"
      - key: CHAT_BRIEFING_IMPRESSION_RETENTION_DAYS
        value: "90"
      # Secrets and per-deploy values — set in Render dashboard, not committed here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: EMAIL_VERIFICATION_URL_BASE
        sync: false
      - key: PASSWORD_RESET_URL_BASE
        sync: false
      # OpenAI-compatible gateway key (currently apilit.dev) — NOT a real
      # OpenAI key. Rotate immediately if this value is ever exposed outside
      # the Render dashboard. Was already set on the now-retired
      # cursus-ai-service service — copy the same value here, don't reuse a
      # key that's been pasted anywhere insecure.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      # Crisis-safety escalation: if left unset, a crisis signal is only
      # logged, nobody is emailed. Must be set to a real, monitored inbox
      # before this feature is shown to anyone other than the demo accounts.
      - key: CRISIS_ESCALATION_EMAIL
        sync: false
      - key: OPS_ALERT_EMAIL
        sync: false
