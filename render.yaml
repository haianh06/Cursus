services:
  - type: web
    name: cursus-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "8000"
      - key: APP_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_ON_START
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CSRF_PROTECTION_ENABLED
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: ACCESS_TOKEN_COOKIE_SAMESITE
        value: none
      - key: ACCESS_TOKEN_COOKIE_SECURE
        value: "true"
      - key: REFRESH_TOKEN_COOKIE_SAMESITE
        value: none
      - key: REFRESH_TOKEN_COOKIE_SECURE
        value: "true"
      - key: MODEL_NAME
        value: gemini-2.5-flash
      # Secrets and per-deploy values — set in Render dashboard, not committed here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: EMAIL_VERIFICATION_URL_BASE
        sync: false
      - key: PASSWORD_RESET_URL_BASE
        sync: false
