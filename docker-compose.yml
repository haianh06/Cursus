# Local full-stack development. This stack deliberately uses its own
# Postgres volume instead of the Supabase DATABASE_URL from .env: local
# startup stays reproducible and cannot mutate the shared database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cursus
      POSTGRES_PASSWORD: cursus
      POSTGRES_DB: cursus
    volumes:
      - cursus_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursus -d cursus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://cursus:cursus@db:5432/cursus
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8100
      # "docker-local-ai-service-key" is a DEV-ONLY placeholder used only when
      # AI_SERVICE_INTERNAL_KEY is unset in .env — production MUST set a real
      # secret (e.g. `openssl rand -hex 32`), see .env.example.
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY:-docker-local-ai-service-key}
      JWT_SECRET_KEY: ${DOCKER_JWT_SECRET_KEY:-docker-local-only-jwt-secret-change-before-deploy-2026}
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173
      CURSUS_FRONTEND_URL: http://localhost:5174
      MOCK_LMS_BASE_URL: http://edusync:9000
      SEED_ON_START: "true"
      SEED_DATASET: demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  ai-service:
    build:
      context: ./ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Unset (empty) means the openai SDK's own default (api.openai.com) --
      # set this when OPENAI_API_KEY is issued by an OpenAI-compatible
      # gateway/proxy instead of OpenAI directly.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # "docker-local-ai-service-key" is a DEV-ONLY placeholder used only when
      # AI_SERVICE_INTERNAL_KEY is unset in .env — production MUST set a real
      # secret (e.g. `openssl rand -hex 32`), see .env.example.
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY:-docker-local-ai-service-key}
      OPENAI_LIGHT_MODEL: ${OPENAI_LIGHT_MODEL:-pro/gpt-5.6-luna}
      OPENAI_STRONG_MODEL: ${OPENAI_STRONG_MODEL:-pro/gpt-5.6-terra}
    restart: unless-stopped

  edusync:
    build:
      context: .
      dockerfile: mock-lms/Dockerfile
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MOCK_LMS_DB_PATH: /app/data/mock_lms.db
      MOCK_LMS_SSO_SHARED_SECRET: ${MOCK_LMS_SSO_SHARED_SECRET:-dev-only-mock-lms-sso-secret}
      MOCK_LMS_JWT_SECRET: ${MOCK_LMS_JWT_SECRET:-docker-local-only-edusync-jwt-secret}
      MOCK_LMS_CLIENT_ID: ${MOCK_LMS_CLIENT_ID:-cursus-tool}
      MOCK_LMS_CLIENT_SECRET: ${MOCK_LMS_CLIENT_SECRET:-docker-local-only-edusync-client-secret}
      CURSUS_BASE_URL: http://localhost:8000
      CURSUS_INTERNAL_BASE_URL: http://backend:8000
      MOCK_LMS_PUBLIC_URL: http://localhost:9000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - edusync_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cursus_db_data:
  edusync_data:
