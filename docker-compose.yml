# Production DB/Auth is Supabase-managed Postgres (ADR-001 in
# docs/decisions/ADR.md) — DATABASE_URL in .env points at Supabase's pooler
# by default. `db`/`redis` below run by default so `docker-compose up` works
# fully offline out of the box: point DATABASE_URL at
# `postgresql://cursus:cursus@db:5432/cursus` and REDIS_URL at
# `redis://redis:6379/0` in your local .env to use them (already the default
# in .env.example).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cursus
      POSTGRES_PASSWORD: cursus
      POSTGRES_DB: cursus
    ports:
      - "5432:5432"
    volumes:
      - cursus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cursus_db_data:
