<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EduSync{% endblock %}</title>
  <style>
    :root {
      --ink: #0f172a;
      --ink-soft: #475569;
      --ink-muted: #94a3b8;
      --line: #e2e8f0;
      --surface: #ffffff;
      --canvas: #f4f6f9;
      --brand: #2563eb;
      --brand-soft: #eff4ff;
      --warn: #b45309;
      --warn-soft: #fef3e0;
      --ok: #15803d;
      --ok-soft: #ecfdf3;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .banner {
      background: var(--warn);
      color: #fff;
      padding: 8px 20px;
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.01em;
    }
    header.app {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
    }
    header.app .inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    header.app a.brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    header.app .tag {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-soft);
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }

    h2.page-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
    p.page-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; }

    .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 18px; min-width: 120px;
    }
    .stat-card .n { font-size: 20px; font-weight: 700; color: var(--ink); }
    .stat-card .l { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }

    .toolbar { margin-bottom: 14px; }
    .toolbar input[type=search] {
      width: 100%; max-width: 320px; padding: 8px 12px; font-size: 13.5px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
    }
    .toolbar input[type=search]:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

    .card-table {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
    thead th {
      background: #fafbfc; font-weight: 600; font-size: 11.5px; color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background-color 0.12s ease; }
    tbody tr:hover { background: #f8fafc; }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .chip {
      display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
      background: #f1f5f9; color: var(--ink-soft);
    }
    .chip.brand { background: var(--brand-soft); color: var(--brand); }
    .chip.warn { background: var(--warn-soft); color: var(--warn); }
    .chip.ok { background: var(--ok-soft); color: var(--ok); }

    form.edit-due { display: flex; gap: 8px; align-items: center; }
    input[type=date] {
      padding: 6px 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
    }
    button {
      padding: 6px 14px; border: 1px solid var(--brand); background: var(--brand); color: #fff;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background-color 0.12s ease;
    }
    button:hover { background: #1d4ed8; }

    .breadcrumb { font-size: 13px; margin-bottom: 10px; }
    .breadcrumb a { color: var(--ink-soft); font-weight: 500; }

    /* Course card grid -- real Canvas shows courses as colour-coded cards,
       not a bare table (research: Canvas "All Courses" dashboard groups
       cards per course, each with its own accent colour), grouped by term. */
    .term-section { margin-bottom: 28px; }
    .term-heading {
      font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;
      letter-spacing: 0.04em; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 8px;
    }
    .term-heading .count { font-weight: 500; text-transform: none; letter-spacing: normal; color: var(--ink-muted); font-size: 12px; }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .course-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; text-decoration: none; color: inherit; display: block;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .course-card:hover {
      text-decoration: none; transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }
    .course-card .accent-bar { height: 6px; }
    .course-card .body { padding: 14px 16px; }
    .course-card .code { font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; }
    .course-card .name {
      font-size: 13.5px; font-weight: 600; color: var(--ink); margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 2.6em;
    }
    .course-card .meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 11.5px; color: var(--ink-soft); font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="banner">Đây là LMS mô phỏng do team Cursus tự dựng để demo tích hợp hệ thống ngoài, không phải Canvas thật của FPT University.</div>
  <header class="app">
    <div class="inner">
      <a class="brand" href="/courses">EduSync</a>
      <span class="tag">Course & Assignment Management</span>
    </div>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
